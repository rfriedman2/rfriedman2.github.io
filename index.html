<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GridIron-60 Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#fff; color:#111; font-family:'Lato',sans-serif; font-size:17px; line-height:1.6; min-height:100vh; }
.app-header { background:#222; padding:18px 20px 14px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.3); }
.app-title { font-family:'Bebas Neue',sans-serif; font-size:28px; color:#e8c96a; letter-spacing:2px; }
.app-sub { font-family:'DM Mono',monospace; font-size:11px; color:#aaa; letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
.tab-bar { display:flex; background:#333; }
.tab-btn { flex:1; padding:12px 4px; background:none; border:none; border-bottom:3px solid transparent; color:#aaa; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all .2s; }
.tab-btn.active { color:#e8c96a; border-bottom-color:#e8c96a; }

.view { display:none; padding:18px; }
.view.active { display:block; }
.section-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; color:#7a5c0e; margin-bottom:14px; margin-top:4px; }

/* SYNC STATUS */
.sync-bar { display:flex; align-items:center; gap:10px; background:#f0fff0; border:2px solid #2a7a2a; border-radius:8px; padding:10px 14px; margin-bottom:18px; }
.sync-bar.error { background:#fff5f5; border-color:#c00; }
.sync-bar.syncing { background:#f0f8ff; border-color:#0a5a8a; }
.sync-dot { width:12px; height:12px; border-radius:50%; background:#2a7a2a; flex-shrink:0; }
.sync-bar.error .sync-dot { background:#c00; }
.sync-bar.syncing .sync-dot { background:#0a5a8a; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.sync-text { font-family:'DM Mono',monospace; font-size:12px; color:#333; font-weight:700; }

.day-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
