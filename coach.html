<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GridIron-60 · Coach View</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial,sans-serif; background:#fff; color:#111; }

.login-screen {
  background:#222;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box {
  background:#fff;
  border-radius:12px;
  padding:40px;
  text-align:center;
  width:300px;
}
.login-box h2 {
  font-size:28px;
  color:#7a5c0e;
  letter-spacing:2px;
  margin-bottom:8px;
}
.login-box p {
  font-size:14px;
  color:#555;
  margin-bottom:24px;
}
.login-box input {
  width:100%;
  padding:14px;
  font-size:18px;
  border:2px solid #ccc;
  border-radius:8px;
  text-align:center;
  outline:none;
  margin-bottom:12px;
}
.login-box input:focus { border-color:#c9a030; }
.login-box button {
  width:100%;
  padding:16px;
  background:#c9a030;
  border:none;
  border-radius:8px;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}
.login-box .error {
  color:#c00;
  font-size:14px;
  margin-top:10px;
  display:none;
}

.main-screen { display:none; }

.header {
  background:#222;
  padding:18px 20px;
  border-bottom:4px solid #c9a030;
}
.header h1 {
  font-size:28px;
  color:#e8c96a;
  letter-spacing:2px;
}
.header p {
  font-size:11px;
  color:#aaa;
  text-transform:uppercase;
  margin-top:2px;
}
.badge {
  display:inline-block;
  background:#0a5a8a;
  color:#fff;
  font-size:11px;
  padding:3px 10px;
  border-radius:3px;
  margin-top:6px;
  font-weight:700;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:16px;
  background:#f5f5f5;
  border-bottom:2px solid #ddd;
}
.stat {
  background:#fff;
  border:2px solid #ddd;
  border-radius:8px;
  padding:12px;
  text-align:center;
}
.stat-n { font-size:32px; font-weight:700; line-height:1; }
.stat-l { font-size:11px; color:#555; text-transform:uppercase; margin-top:4px; }

.content { padding:16px; }

.refresh-btn {
  display:block;
  width:100%;
  padding:14px;
  background:#222;
  color:#e8c96a;
  border:none;
  border-radius:10px;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:20px;
}

.loading {
  text-align:center;
  padding:40px;
  color:#555;
  font-size:16px;
}

.day-group { margin-bottom:24px; }
.day-label {
  font-size:20px;
  font-weight:700;
  color:#7a5c0e;
  margin-bottom:10px;
  padding-bottom:6px;
  border-bottom:3px solid #f0e0a0;
}

.session {
  background:#fff;
  border:2px solid #ddd;
  border-radius:10px;
  margin-bottom:10px;
  overflow:hidden;
}
.session-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  background:#f5f5f5;
  border-bottom:2px solid #ddd;
  cursor:pointer;
}
.session-date { font-size:14px; font-weight:700; color:#333; font-family:monospace; }
.session-day  { font-size:13px; color:#555; margin-top:2px; }
.session-toggle { font-size:18px; color:#555; transition:transform 0.2s; }
.session.open .session-toggle { transform:rotate(180deg); }
.session-body { display:none; padding:14px 16px; }
.session.open .session-body { display:block; }

.ex-name {
  font-weight:700;
  font-size:15px;
  color:#111;
  margin-top:10px;
  margin-bottom:5px;
  border-left:4px solid #c9a030;
  padding-left:8px;
}
.ex-name:first-child { margin-top:0; }

.set-row {
  display:grid;
  grid-template-columns:60px 1fr 1fr 30px;
  gap:8px;
  font-family:monospace;
  font-size:13px;
  padding:4px 0;
  border-bottom:1px solid #eee;
  color:#333;
}
.set-row:last-child { border-bottom:none; }
.set-row.done { color:#2a7a2a; font-weight:700; }
.set-label { color:#888; }

.empty { text-align:center; padding:40px; color:#555; font-size:15px; }
.error-msg { text-align:center; padding:40px; color:#c00; font-size:15px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>GRIDIRON-60</h2>
    <p>Coach View — Enter Password</p>
    <input type="password" id="passwordInput" placeholder="PASSWORD" />
    <button onclick="checkPassword()">ENTER</button>
    <div class="error" id="errorMsg">Incorrect password. Try again.</div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div class="main-screen" id="mainScreen">
  <div class="header">
    <h1>GRIDIRON-60</h1>
    <p>Workout History · Live Data</p>
    <div class="badge">👁 Coach View — Read Only</div>
  </div>

  <div class="stats">
    <div class="stat" style="grid-column:span 3;padding:10px 16px;display:flex;justify-content:space-between;align-items:center"><div class="stat-l">LAST WORKOUT</div><div id="statLast" style="font-family:'DM Mono',monospace;font-size:14px;color:#333;font-weight:700">—</div></div></div><div class="stats"><div class="stat"><div class="stat-n" id="statSessions" style="color:#c9a030">-</div><div class="stat-l">Sessions</div></div>
    <div class="stat"><div class="stat-n" id="statSets" style="color:#2a7a2a">-</div><div class="stat-l">Total Sets</div></div>
    <div class="stat"><div class="stat-n" id="statDays" style="color:#0a4a7a">-</div><div class="stat-l">Days Trained</div></div>
  </div>

  <div class="content">
    <button class="refresh-btn" onclick="loadData()">↻ REFRESH DATA</button>
    <div id="workoutData"><div class="loading">Loading workout data...</div></div>
  </div>
</div>

<script>
const SHEET_ID = '1lCMZDUZGVDGTDHMbpXoAwFqyCHKVGb6m6_fCc_g8DK0';
const PASSWORD = 'gridiron60';

function checkPassword() {
  var pwd = document.getElementById('passwordInput').value;
  if (pwd === PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    loadData();
  } else {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('passwordInput').value = '';
  }
}

document.getElementById('passwordInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') checkPassword();
});

async function loadData() {
  document.getElementById('workoutData').innerHTML = '<div class="loading">Loading workout data...</div>';
  
  try {
    // Fetch ALL rows - add cache buster to prevent stale data
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Log&headers=1&t=' + Date.now();
    var response = await fetch(url);
    var text = await response.text();
    
    var rows = parseCSV(text);
    
    if (rows.length <= 1) {
      document.getElementById('workoutData').innerHTML = '<div class="empty">No workout data found yet. Log a workout first.</div>';
      return;
    }
    
    // Parse rows (skip header)
    var data = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (r.length >= 2 && (r[0] || r[1])) {
        data.push({
          date: r[0] || '',
          day:  r[1] || '',
          exercise: r[2] || '',
          set:  r[3] || '',
          weight: r[4] || '',
          reps: r[5] || '',
          done: r[6] || '',
          notes: r[7] || ''
        });
      }
    }
    
    // Group by session (date + day)
    var sessions = {};
    var sessionOrder = [];
    data.forEach(function(row) {
      var key = row.date + '||' + row.day;
      if (!sessions[key]) {
        sessions[key] = { date: row.date, day: row.day, exercises: {}, exOrder: [] };
        sessionOrder.push(key);
      }
      if (!sessions[key].exercises[row.exercise]) {
        sessions[key].exercises[row.exercise] = [];
        sessions[key].exOrder.push(row.exercise);
      }
      sessions[key].exercises[row.exercise].push(row);
    });
    
    // Group sessions by day name
    var dayGroups = {};
    var dayOrder = [];
    sessionOrder.reverse();
    sessionOrder.forEach(function(key) {
      var sess = sessions[key];
      if (!dayGroups[sess.day]) {
        dayGroups[sess.day] = [];
        dayOrder.push(sess.day);
      }
      dayGroups[sess.day].push(sess);
    });
    
    // Update stats
    document.getElementById('statSessions').textContent = sessionOrder.length;
    document.getElementById('statSets').textContent = data.length;
    document.getElementById('statDays').textContent = dayOrder.length;
    
    // Build HTML
    var html = '';
    var cnt = 0;
    
    dayOrder.forEach(function(dayName) {
      html += '<div class="day-group"><div class="day-label">' + dayName + '</div>';
      dayGroups[dayName].forEach(function(sess) {
        cnt++;
        var sid = 'sess' + cnt;
        var exHtml = '';
        sess.exOrder.forEach(function(exName) {
          var sets = sess.exercises[exName];
          exHtml += '<div class="ex-name">' + exName + '</div>';
          sets.forEach(function(s) {
            var isDone = s.done === '\u2713' || s.done === 'TRUE' || s.done === '✓';
            exHtml += '<div class="set-row' + (isDone ? ' done' : '') + '">';
            exHtml += '<span class="set-label">' + s.set + '</span>';
            exHtml += '<span>' + (s.weight || '—') + '</span>';
            exHtml += '<span>' + (s.reps || '—') + '</span>';
            exHtml += '<span>' + (isDone ? '✓' : '') + '</span>';
            exHtml += '</div>';
          });
        });
        html += '<div class="session" id="' + sid + '">';
        html += '<div class="session-header" onclick="toggleSession(\'' + sid + '\')">';
        html += '<div><div class="session-date">' + sess.date + '</div>';
        html += '<div class="session-day">' + sess.day + '</div></div>';
        html += '<div class="session-toggle">▾</div></div>';
        html += '<div class="session-body">' + exHtml + '</div></div>';
      });
      html += '</div>';
    });
    
    document.getElementById('workoutData').innerHTML = html;
    
  } catch(err) {
    document.getElementById('workoutData').innerHTML = '<div class="error-msg">Could not load data. Make sure Google Sheet is set to "Anyone with link can view".<br><br>Error: ' + err.message + '</div>';
  }
}

function toggleSession(id) {
  document.getElementById(id).classList.toggle('open');
}

function parseCSV(text) {
  var rows = [];
  var lines = text.split('\n');
  lines.forEach(function(line) {
    if (!line.trim()) return;
    var cols = [];
    var inQuote = false;
    var col = '';
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"') {
        inQuote = !inQuote;
      } else if (c === ',' && !inQuote) {
        cols.push(col.trim());
        col = '';
      } else {
        col += c;
      }
    }
    cols.push(col.trim());
    rows.push(cols);
  });
  return rows;
}
</script>
</body>
</html>
