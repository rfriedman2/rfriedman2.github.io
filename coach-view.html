<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GridIron-60 · Coach View</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#fff; color:#111; font-family:'Lato',sans-serif; font-size:16px; line-height:1.6; min-height:100vh; }

.app-header { background:#222; padding:18px 20px 14px; }
.app-title { font-family:'Bebas Neue',sans-serif; font-size:28px; color:#e8c96a; letter-spacing:2px; }
.app-sub { font-family:'DM Mono',monospace; font-size:11px; color:#aaa; letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
.coach-badge { display:inline-block; background:#0a5a8a; color:#fff; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; padding:3px 10px; text-transform:uppercase; margin-top:6px; border-radius:3px; font-weight:700; }

.tab-bar { display:flex; background:#333; }
.tab-btn { flex:1; padding:12px 4px; background:none; border:none; border-bottom:3px solid transparent; color:#aaa; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.tab-btn.active { color:#e8c96a; border-bottom-color:#e8c96a; }

.view { display:none; padding:18px; }
.view.active { display:block; }
.section-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; color:#7a5c0e; margin-bottom:14px; margin-top:4px; }

/* STATUS */
.status-bar { display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:8px; margin-bottom:20px; border:2px solid #ddd; }
.status-bar.loading { background:#f0f8ff; border-color:#0a5a8a; }
.status-bar.success { background:#f0fff0; border-color:#2a7a2a; }
.status-bar.error   { background:#fff5f5; border-color:#c00; }
.status-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
.status-bar.loading .status-dot { background:#0a5a8a; animation:pulse 1s infinite; }
.status-bar.success .status-dot { background:#2a7a2a; }
.status-bar.error   .status-dot { background:#c00; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.status-text { font-family:'DM Mono',monospace; font-size:12px; color:#333; font-weight:700; }

/* SUMMARY CARDS */
.summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
.summary-card { background:#fff; border:2px solid #ddd; border-radius:10px; padding:14px; text-align:center; }
.summary-n { font-family:'Bebas Neue',sans-serif; font-size:36px; line-height:1; }
.summary-l { font-family:'DM Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#555; margin-top:3px; font-weight:700; }

/* SESSION CARDS */
.day-group { margin-bottom:28px; }
.day-group-label { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#7a5c0e; letter-spacing:1px; margin-bottom:12px; padding-bottom:8px; border-bottom:3px solid #f0e0a0; }

.session-card { background:#fff; border:2px solid #ddd; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.session-header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:#f5f5f5; border-bottom:2px solid #ddd; cursor:pointer; }
.session-date { font-family:'DM Mono',monospace; font-size:14px; color:#333; font-weight:700; }
.session-day  { font-size:13px; color:#555; margin-top:2px; }
.session-toggle { font-size:18px; color:#555; transition:transform .2s; }
.session-card.open .session-toggle { transform:rotate(180deg); }
.session-body { display:none; padding:14px 16px; }
.session-card.open .session-body { display:block; }

.ex-name { font-weight:700; font-size:15px; color:#111; margin-top:12px; margin-bottom:6px; border-left:4px solid #c9a030; padding-left:8px; }
.ex-name:first-child { margin-top:0; }

.set-row { display:grid; grid-template-columns:60px 1fr 1fr 30px; gap:8px; font-family:'DM Mono',monospace; font-size:13px; padding:5px 0; border-bottom:1px solid #eee; color:#333; }
.set-row:last-child { border-bottom:none; }
.set-done { color:#2a7a2a; font-weight:700; }
.set-label { color:#888; }
.ex-notes { font-size:13px; color:#555; font-style:italic; margin-top:6px; padding-left:8px; }

/* PROGRESS TAB */
.ex-select { width:100%; background:#fff; border:2px solid #ccc; border-radius:10px; padding:14px; font-family:'Lato',sans-serif; font-size:16px; color:#111; outline:none; margin-bottom:20px; -webkit-appearance:none; font-weight:700; }
.progress-card { background:#fff; border:2px solid #ddd; border-radius:10px; padding:16px; margin-bottom:14px; }
.progress-title { font-weight:700; font-size:16px; color:#111; margin-bottom:14px; border-left:4px solid #c9a030; padding-left:10px; }
.bar-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.bar-date { font-family:'DM Mono',monospace; font-size:11px; color:#555; width:70px; flex-shrink:0; font-weight:700; }
.bar-track { flex:1; background:#f0f0f0; border-radius:6px; height:24px; overflow:hidden; }
.bar-fill { height:100%; background:#c9a030; border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; min-width:40px; }
.bar-val { font-family:'DM Mono',monospace; font-size:11px; color:#fff; white-space:nowrap; font-weight:700; }
.prog-stats { display:flex; border-top:2px solid #eee; margin-top:8px; }
.prog-stat { flex:1; text-align:center; padding:14px 8px; }
.prog-stat + .prog-stat { border-left:2px solid #eee; }
.prog-n { font-family:'Bebas Neue',sans-serif; font-size:32px; line-height:1; }
.prog-l { font-family:'DM Mono',monospace; font-size:10px; color:#555; text-transform:uppercase; letter-spacing:1px; margin-top:2px; font-weight:700; }

/* REFRESH */
.refresh-btn { width:100%; background:#222; color:#e8c96a; border:none; border-radius:10px; padding:16px; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; cursor:pointer; margin-bottom:20px; }

.empty { text-align:center; color:#555; font-size:15px; padding:40px 20px; }

footer { text-align:center; padding:24px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:#555; border-top:2px solid #ddd; margin-top:20px; text-transform:uppercase; font-weight:700; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">GridIron-60</div>
  <div class="app-sub">Workout History · Live Data</div>
  <div class="coach-badge">👁 Coach View — Read Only</div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('history',this)">History</button>
  <button class="tab-btn" onclick="switchTab('progress',this)">Progress</button>
</div>

<!-- HISTORY -->
<div class="view active" id="view-history">
  <div class="status-bar loading" id="status-bar">
    <div class="status-dot"></div>
    <div class="status-text" id="status-text">Loading workout data...</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">↻ REFRESH DATA</button>
  <div class="summary-grid" id="summary-grid" style="display:none">
    <div class="summary-card"><div class="summary-n" id="sum-sessions" style="color:#c9a030">—</div><div class="summary-l">Sessions</div></div>
    <div class="summary-card"><div class="summary-n" id="sum-exercises" style="color:#2a7a2a">—</div><div class="summary-l">Total Sets</div></div>
    <div class="summary-card"><div class="summary-n" id="sum-days" style="color:#0a4a7a">—</div><div class="summary-l">Days Trained</div></div>
  </div>
  <div id="history-container"></div>
</div>

<!-- PROGRESS -->
<div class="view" id="view-progress">
  <div class="section-title">Weight Progress</div>
  <select class="ex-select" id="prog-select" onchange="renderProgress()">
    <option value="">— Select an exercise —</option>
  </select>
  <div id="progress-container"></div>
</div>

<footer>GridIron-60 · Coach View · Read Only · Data updates when athlete saves a workout</footer>

<script>
const SHEET_ID = '1lCMZDUZGVDGTDHMbpXoAwFqyCHKVGb6m6_fCc_g8DK0';
let allData = [];
let exercises = [];

// ═══════════════════════════════
// LOAD FROM GOOGLE SHEETS
// ═══════════════════════════════
async function loadData() {
  setStatus('loading', 'Loading workout data...');
  document.getElementById('summary-grid').style.display = 'none';

  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
    const response = await fetch(url);
    const text = await response.text();

    // Google wraps response in /*O_o*/ google.visualization.Query.setResponse(...)
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/)[1]);
    const rows = json.table.rows;
    const cols = json.table.cols;

    if (!rows || rows.length === 0) {
      setStatus('error', 'No workout data found yet. Log a workout first.');
      document.getElementById('history-container').innerHTML = '<div class="empty">No workouts logged yet.</div>';
      return;
    }

    // Parse rows — skip header row
    allData = [];
    const exSet = new Set();

    rows.forEach((row, i) => {
      if (i === 0) return; // skip header
      const cells = row.c;
      if (!cells || !cells[0]) return;

      const entry = {
        date:     cells[0]?.v || '',
        day:      cells[1]?.v || '',
        exercise: cells[2]?.v || '',
        set:      cells[3]?.v || '',
        weight:   cells[4]?.v || '',
        reps:     cells[5]?.v || '',
        done:     cells[6]?.v || '',
        notes:    cells[7]?.v || '',
        tempo:    cells[8]?.v || ''
      };
      if (entry.exercise) exSet.add(entry.exercise);
      allData.push(entry);
    });

    exercises = Array.from(exSet).sort();

    // Populate exercise select
    const sel = document.getElementById('prog-select');
    sel.innerHTML = '<option value="">— Select an exercise —</option>';
    exercises.forEach(ex => {
      const o = document.createElement('option');
      o.value = ex; o.textContent = ex;
      sel.appendChild(o);
    });

    renderHistory();
    setStatus('success', `✓ ${allData.length} sets loaded · Last updated just now`);
    document.getElementById('summary-grid').style.display = 'grid';

  } catch(err) {
    console.error(err);
    setStatus('error', 'Could not load data. Make sure sheet is set to "Anyone with link can view".');
    document.getElementById('history-container').innerHTML = `<div class="empty">Could not connect to Google Sheets.<br><br>Make sure sharing is set to<br><strong>"Anyone with the link can view"</strong></div>`;
  }
}

// ═══════════════════════════════
// RENDER HISTORY
// ═══════════════════════════════
function renderHistory() {
  const container = document.getElementById('history-container');

  // Group by date + day
  const sessions = {};
  allData.forEach(row => {
    const key = `${row.date}||${row.day}`;
    if (!sessions[key]) sessions[key] = { date:row.date, day:row.day, exercises:{} };
    if (!sessions[key].exercises[row.exercise]) sessions[key].exercises[row.exercise] = [];
    sessions[key].exercises[row.exercise].push(row);
  });

  // Group sessions by day name
  const dayGroups = {};
  Object.values(sessions).forEach(s => {
    if (!dayGroups[s.day]) dayGroups[s.day] = [];
    dayGroups[s.day].push(s);
  });

  // Summary stats
  const totalSessions = Object.keys(sessions).length;
  const totalSets = allData.length;
  const totalDays = Object.keys(dayGroups).length;
  document.getElementById('sum-sessions').textContent = totalSessions;
  document.getElementById('sum-exercises').textContent = totalSets;
  document.getElementById('sum-days').textContent = totalDays;

  if (Object.keys(sessions).length === 0) {
    container.innerHTML = '<div class="empty">No workouts logged yet.</div>';
    return;
  }

  container.innerHTML = '';
  Object.entries(dayGroups).forEach(([dayName, daySessions]) => {
    const group = document.createElement('div');
    group.className = 'day-group';

    const sessHTML = daySessions.map((session, si) => {
      const exHTML = Object.entries(session.exercises).map(([exName, sets]) => {
        const setsHTML = sets.map(set =>
          `<div class="set-row ${set.done==='✓'?'set-done':''}">
            <span class="set-label">${set.set}</span>
            <span>${set.weight||'—'}</span>
            <span>${set.reps||'—'}</span>
            <span>${set.done||''}</span>
          </div>`
        ).join('');
        const notes = sets.find(s=>s.notes)?.notes || '';
        return `<div class="ex-name">${exName}</div>${setsHTML}${notes?`<div class="ex-notes">${notes}</div>`:''}`;
      }).join('');

      const id = `sess-${dayName.replace(/\s/g,'')}-${si}`;
      return `<div class="session-card" id="${id}">
        <div class="session-header" onclick="toggleSession('${id}')">
          <div>
            <div class="session-date">${session.date}</div>
            <div class="session-day">${session.day}</div>
          </div>
          <div class="session-toggle">▾</div>
        </div>
        <div class="session-body">${exHTML}</div>
      </div>`;
    }).join('');

    group.innerHTML = `<div class="day-group-label">${dayName}</div>${sessHTML}`;
    container.appendChild(group);
  });
}

// ═══════════════════════════════
// RENDER PROGRESS
// ═══════════════════════════════
function renderProgress() {
  const exName = document.getElementById('prog-select').value;
  const container = document.getElementById('progress-container');
  if (!exName) { container.innerHTML=''; return; }

  const pts = [];
  const sessionMap = {};
  allData.filter(r => r.exercise === exName && r.done === '✓' && r.weight).forEach(row => {
    const key = row.date;
    const w = parseFloat(row.weight);
    if (!isNaN(w)) {
      if (!sessionMap[key] || sessionMap[key] < w) sessionMap[key] = w;
    }
  });

  Object.entries(sessionMap).forEach(([date, maxW]) => pts.push({date, maxW}));
  pts.sort((a,b) => a.date.localeCompare(b.date));

  if (!pts.length) {
    container.innerHTML = `<div class="progress-card"><div class="empty">No completed sets logged for<br><strong>${exName}</strong> yet.</div></div>`;
    return;
  }

  const maxW = Math.max(...pts.map(p=>p.maxW));
  const barsHTML = pts.map(p => {
    const pct = Math.max(12, p.maxW/maxW*100);
    const ds = p.date.length > 8 ? p.date.substring(0,8) : p.date;
    return `<div class="bar-row">
      <div class="bar-date">${ds}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"><span class="bar-val">${p.maxW}</span></div></div>
    </div>`;
  }).join('');

  const best = Math.max(...pts.map(p=>p.maxW));
  const gain = best - pts[0].maxW;

  container.innerHTML = `
    <div class="progress-card">
      <div class="progress-title">${exName} — Max Weight Per Session</div>
      ${barsHTML}
      <div class="prog-stats">
        <div class="prog-stat"><div class="prog-n" style="color:#c9a030">${best}</div><div class="prog-l">Best (lbs)</div></div>
        <div class="prog-stat"><div class="prog-n" style="color:#2a7a2a">${gain>=0?'+':''}${gain}</div><div class="prog-l">Total Gain</div></div>
        <div class="prog-stat"><div class="prog-n" style="color:#0a4a7a">${pts.length}</div><div class="prog-l">Sessions</div></div>
      </div>
    </div>`;
}

function toggleSession(id) { document.getElementById(id).classList.toggle('open'); }

function setStatus(type, msg) {
  const bar = document.getElementById('status-bar');
  const text = document.getElementById('status-text');
  bar.className = `status-bar ${type}`;
  text.textContent = msg;
}

function switchTab(tab, btn) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`view-${tab}`).classList.add('active');
  btn.classList.add('active');
  if (tab==='progress') renderProgress();
}

// Auto load on open
loadData();
</script>
</body>
</html>
