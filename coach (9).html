<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GridIron-60 | Coach Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #eee; min-height: 100vh; }

  #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 360px; text-align: center; }
  .login-logo { font-size: 2.4rem; font-weight: 900; color: #e8c96a; letter-spacing: 2px; margin-bottom: 4px; }
  .login-sub { color: #888; font-size: 0.85rem; margin-bottom: 28px; }
  .login-box input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; margin-bottom: 14px; text-align: center; letter-spacing: 4px; }
  .login-box input::placeholder { letter-spacing: 1px; color: #555; }
  .login-btn { width: 100%; padding: 14px; background: #e8c96a; color: #111; font-weight: 800; font-size: 1rem; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 1px; }
  .login-btn:hover { background: #f0d980; }
  .login-error { color: #e05555; font-size: 0.85rem; margin-top: 10px; display: none; }

  #portal { display: none; }
  header { background: #1a1a1a; border-bottom: 2px solid #e8c96a; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-title { font-size: 1.3rem; font-weight: 900; color: #e8c96a; letter-spacing: 1px; }
  .header-sub { font-size: 0.7rem; color: #888; margin-top: 2px; }
  .refresh-btn { background: #e8c96a; color: #111; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

  .portal-body { padding: 20px; max-width: 900px; margin: 0 auto; }

  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .summary-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; text-align: center; }
  .summary-card .val { font-size: 1.2rem; font-weight: 900; color: #e8c96a; line-height: 1; }
  .summary-card .lbl { font-size: 0.7rem; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-bar select, .filter-bar input { background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; flex: 1; min-width: 120px; }

  .session-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
  .session-header { background: #222; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid #2a2a2a; }
  .session-header:hover { background: #252525; }
  .session-day { font-weight: 800; color: #e8c96a; font-size: 1rem; }
  .session-date { font-size: 0.8rem; color: #888; margin-top: 2px; }
  .session-meta { text-align: right; font-size: 0.75rem; color: #666; }
  .session-toggle { color: #e8c96a; font-size: 1.2rem; transition: transform 0.2s; }
  .session-toggle.open { transform: rotate(180deg); }
  .session-body { display: none; padding: 16px; }
  .session-body.open { display: block; }

  .ex-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 12px; }
  .ex-table th { background: #222; color: #e8c96a; padding: 8px 10px; text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .ex-table td { padding: 8px 10px; border-bottom: 1px solid #2a2a2a; color: #ddd; }
  .ex-table tr:last-child td { border-bottom: none; }
  .ex-table tr:nth-child(even) td { background: #1e1e1e; }
  .completed-yes { color: #4caf7d; font-weight: 700; }
  .completed-no { color: #e05555; }

  .cardio-card { background: #0d2a1f; border: 1px solid #1a5c3a; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 0.82rem; }
  .cardio-title { color: #4caf7d; font-weight: 700; margin-bottom: 6px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .cardio-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .cardio-item { color: #aaa; }
  .cardio-item span { color: #eee; font-weight: 600; }

  .duration-badge { display: inline-block; background: #1a2a3a; border: 1px solid #2a4a6a; border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; color: #7ab8f5; margin-bottom: 10px; }
  .notes-block { background: #1e1e1e; border-left: 3px solid #e8c96a; padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 0.8rem; color: #bbb; margin-top: 4px; }

  .loading { text-align: center; padding: 60px 20px; color: #888; }
  .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #e8c96a; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 40px 20px; color: #555; font-size: 0.9rem; }
  .last-updated { text-align: center; color: #444; font-size: 0.72rem; padding: 20px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">GRIDIRON-60</div>
    <div class="login-sub">Coach Portal</div>
    <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">ENTER PORTAL</button>
    <div class="login-error" id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<div id="portal">
  <header>
    <div>
      <div class="header-title">⚡ GRIDIRON-60</div>
      <div class="header-sub">Coach Portal · Robert Friedman</div>
    </div>
    <button class="refresh-btn" onclick="loadData()">↺ Refresh</button>
  </header>
  <div class="portal-body">
    <div class="summary-grid">
      <div class="summary-card"><div class="val" id="s-sessions">—</div><div class="lbl">Sessions</div></div>
      <div class="summary-card"><div class="val" id="s-sets">—</div><div class="lbl">Total Sets</div></div>
      <div class="summary-card"><div class="val" id="s-days">—</div><div class="lbl">Days Active</div></div>
      <div class="summary-card"><div class="val" id="s-last">—</div><div class="lbl">Last Workout</div></div>
    </div>
    <div class="filter-bar">
      <select id="filter-day" onchange="renderSessions()">
        <option value="">All Days</option>
        <option>Chest</option>
        <option>Back</option>
        <option>Legs</option>
        <option>Arms</option>
        <option>Shoulders & Abs</option>
      </select>
      <input type="text" id="filter-search" placeholder="Search exercise..." oninput="renderSessions()">
    </div>
    <div id="sessions-container">
      <div class="loading"><div class="spinner"></div>Loading workout data…</div>
    </div>
    <div class="last-updated" id="last-updated"></div>
  </div>
</div>

<script>
const SHEET_ID = '1lCMZDUZGVDGTDHMbpXoAwFqyCHKVGb6m6_fCc_g8DK0';
const PASSWORD = 'gridiron60';
let allSessions = [];

function tryLogin() {
  const val = document.getElementById('pw-input').value.trim();
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('portal').style.display = 'block';
    loadData();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

async function loadData() {
  document.getElementById('sessions-container').innerHTML =
    '<div class="loading"><div class="spinner"></div>Loading workout data…</div>';
  try {
    const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
      '/gviz/tq?tqx=out:csv&sheet=Sheet1&t=' + Date.now();
    const res = await fetch(url);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('No data found');
    const headers = rows[0];
    const data = rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h.trim()] = (r[i] || '').trim());
      return obj;
    });
    allSessions = groupIntoSessions(data);
    updateSummary();
    renderSessions();
    document.getElementById('last-updated').textContent =
      'Last refreshed: ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('sessions-container').innerHTML =
      '<div class="empty-state">⚠️ Could not load data.<br><small>' + err.message + '</small><br><br>Make sure the Google Sheet is set to <strong>Anyone with the link can view</strong>.</div>';
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') { if (inQ && text[i+1] === '"') { cell += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { row.push(cell); cell = ''; }
    else if ((c === '\n' || c === '\r') && !inQ) {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(x => x)) rows.push(row);
      row = [];
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); if (row.some(x => x)) rows.push(row); }
  return rows;
}

function groupIntoSessions(data) {
  const map = {};
  data.forEach(row => {
    const key = (row['Date'] || '') + '||' + (row['Day'] || '');
    if (!map[key]) {
      map[key] = {
        date: row['Date'] || '',
        day: row['Day'] || '',
        duration: row['Duration (min)'] || '',
        cardioType: row['Cardio Type'] || '',
        cardioDuration: row['Cardio Duration'] || '',
        cardioIntensity: row['Cardio Intensity'] || '',
        cardioNotes: row['Cardio Notes'] || '',
        exercises: []
      };
    }
    map[key].exercises.push({
      exercise: row['Exercise'] || '',
      set: row['Set'] || '',
      weight: row['Weight'] || '',
      reps: row['Reps'] || '',
      completed: row['Completed'] || '',
      notes: row['Notes'] || ''
    });
  });
  function parseDate(s) {
    if (!s) return 0;
    if (s.includes('/')) { const p = s.split('/'); return new Date(parseInt(p[2]), parseInt(p[0])-1, parseInt(p[1])); }
    return new Date(s + 'T12:00:00');
  }
  return Object.values(map).sort((a, b) => parseDate(b.date) - parseDate(a.date));
}

function updateSummary() {
  const totalSets = allSessions.reduce((acc, s) => acc + s.exercises.length, 0);
  const uniqueDays = new Set(allSessions.map(s => s.date)).size;
  const lastDate = allSessions.length ? allSessions[0].date : '';
  document.getElementById('s-sessions').textContent = allSessions.length;
  document.getElementById('s-sets').textContent = totalSets;
  document.getElementById('s-days').textContent = uniqueDays;
  document.getElementById('s-last').textContent = lastDate ? allSessions[0].day + ' · ' + formatDate(lastDate) : '—';
}

function renderSessions() {
  const dayFilter = document.getElementById('filter-day').value.toLowerCase();
  const searchFilter = document.getElementById('filter-search').value.toLowerCase();
  let filtered = allSessions.filter(s => {
    const matchDay = !dayFilter || s.day.toLowerCase().includes(dayFilter);
    const matchSearch = !searchFilter || s.exercises.some(e => e.exercise.toLowerCase().includes(searchFilter));
    return matchDay && matchSearch;
  });
  if (!filtered.length) {
    document.getElementById('sessions-container').innerHTML = '<div class="empty-state">No sessions match your filter.</div>';
    return;
  }
  let html = '';
  filtered.forEach((session, idx) => {
    const hasCardio = session.cardioType || session.cardioDuration;
    html += `<div class="session-card">
      <div class="session-header" onclick="toggleSession(${idx})">
        <div>
          <div class="session-day">${session.day}</div>
          <div class="session-date">${formatDate(session.date)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="session-meta">${session.exercises.length} sets</div>
          <div class="session-toggle" id="toggle-${idx}">▾</div>
        </div>
      </div>
      <div class="session-body" id="body-${idx}">`;
    if (session.duration) html += `<div class="duration-badge">⏱ Workout Duration: ${session.duration} min</div>`;
    html += `<table class="ex-table"><thead><tr><th>Exercise</th><th>Set</th><th>Weight</th><th>Reps</th><th>Done</th></tr></thead><tbody>`;
    session.exercises.forEach(ex => {
      const done = ex.completed === 'Yes' || ex.completed === 'TRUE';
      html += `<tr>
        <td>${ex.exercise}</td>
        <td>${ex.set}</td>
        <td>${ex.weight ? (ex.weight.toString().toLowerCase().includes('lb') ? ex.weight : ex.weight + ' lbs') : '—'}</td>
        <td>${ex.reps || '—'}</td>
        <td class="${done ? 'completed-yes' : 'completed-no'}">${done ? '✓' : '✗'}</td>
      </tr>`;
      if (ex.notes) html += `<tr><td colspan="5"><div class="notes-block">📝 ${ex.notes}</div></td></tr>`;
    });
    html += `</tbody></table>`;
    if (hasCardio) {
      html += `<div class="cardio-card"><div class="cardio-title">🚴 Cardio</div><div class="cardio-row">
        ${session.cardioType ? `<div class="cardio-item">Type: <span>${session.cardioType}</span></div>` : ''}
        ${session.cardioDuration ? `<div class="cardio-item">Duration: <span>${session.cardioDuration} min</span></div>` : ''}
        ${session.cardioIntensity ? `<div class="cardio-item">Intensity: <span>${session.cardioIntensity}</span></div>` : ''}
        ${session.cardioNotes ? `<div class="cardio-item">Notes: <span>${session.cardioNotes}</span></div>` : ''}
      </div></div>`;
    }
    html += `</div></div>`;
  });
  document.getElementById('sessions-container').innerHTML = html;
}

function toggleSession(idx) {
  const body = document.getElementById('body-' + idx);
  const toggle = document.getElementById('toggle-' + idx);
  body.classList.toggle('open');
  toggle.classList.toggle('open');
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    // Handle M/D/YYYY, MM/DD/YYYY, YYYY-MM-DD
    let d;
    if (dateStr.includes('/')) {
      const parts = dateStr.split('/');
      // parts: month, day, year
      d = new Date(parseInt(parts[2]), parseInt(parts[0])-1, parseInt(parts[1]));
    } else {
      d = new Date(dateStr + 'T12:00:00');
    }
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  } catch(e) { return dateStr; }
}
</script>
</body>
</html>
